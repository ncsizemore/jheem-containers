        asset_digest_policy: per_location_release_asset
        calibration_code: final.ehe.state
        sample_count: 1000
        ensemble_kind: full
        target_set: ehe-public-v1
        definition_evidence: ehe-likelihood-current-review
      ryan-white:
        label: Ryan White service fit
