schema_version: jheem-calibration-target-registry/v1
registry_id: ryan-white-calibration-targets-v1
scope: initial_public_panel_allowlist
coverage_status: partial
coverage_note: >-
  This registry enumerates intended public calibration panels and the non-visual
  Ryan White likelihood component needed to interpret them. It is not an
  exhaustive serialization of every EHE likelihood instruction or weight.

policies:
  observation_binding: explicit_registry_only
  simset_metadata_binding: prohibited
  legacy_adap_mapping: reject_adap_clients_to_non_adap_clients
  manager_binary_redistribution: controlled_only
  public_artifacts: minimal_derived_payloads
  historical_confidence_values: [verified, reconstructed, unknown]
  manager_binding_semantics: all_explicit_series_mappable_to_model_geography

data_managers:
  ryan-white-web-display-2025-04-08:
