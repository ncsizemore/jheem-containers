sources:
  hrsa-rwhap-annual:
    family: HRSA
    label: Ryan White HIV/AIDS Program Annual Data Reports
    url: https://ryanwhite.hrsa.gov/data/reports
    attribution_required: true
    public_reuse_status: public_domain_with_citation
  nastad-adap-monitoring:
    family: NASTAD
    label: National RWHAP Part B ADAP Monitoring Project Annual Reports
    url: https://nastad.org/adap-monitoring-project
    attribution_required: true
    public_reuse_status: minimal_derived_values_pending_confirmation
  cdc-nhss-atlasplus:
    family: NHSS
    label: CDC National HIV Surveillance System and AtlasPlus
    url: https://www.cdc.gov/hiv-data/nhss/index.html
    attribution_required: true
    public_reuse_status: public_suppressed_release_only
  cdc-brfss:
    family: BRFSS
    label: CDC Behavioral Risk Factor Surveillance System
    url: https://www.cdc.gov/brfss/
    attribution_required: true
    public_reuse_status: public_suppressed_release_only
  aidsvu-prep:
    family: AIDSVu/IQVIA
    label: AIDSVu public PrEP data
    url: https://aidsvu.org/data-methods/data-methods-statecounty/
    attribution_required: true
    public_reuse_status: public_dataset_with_credit_and_suppression
  local-health-department-suppression:
    family: LHD
    label: Local health department viral suppression reports embedded in the archived manager
    url: https://jheem.org/ryan-white/explorer
    attribution_required: true
    public_reuse_status: minimal_derived_values_pending_source_confirmation

