target_sets:
  ehe-public-v1:
    stage: ehe
    exhaustive: false
    target_ids:
      - ehe-diagnoses
      - ehe-diagnosed-prevalence
      - ehe-awareness
      - ehe-suppression
      - ehe-testing
      - ehe-prep-uptake
  ryan-white-msa-v1:
    stage: ryan-white
    exhaustive: true
    target_ids:
      - rw-non-adap-clients
      - rw-non-adap-sex-risk-distribution
      - rw-oahs-clients
      - rw-oahs-suppression
      - rw-msa-adap-ratio
      - rw-msa-adap-suppressed-share-diagnosed
  ryan-white-state-v1:
    stage: ryan-white
    exhaustive: true
    target_ids:
      - rw-non-adap-clients
      - rw-non-adap-sex-risk-distribution
      - rw-oahs-clients
      - rw-oahs-suppression
      - rw-state-adap-clients
      - rw-state-adap-suppression

targets:
  ehe-diagnoses:
    stage: ehe
    classification: active_likelihood_family
    label: New HIV diagnoses
    simulation: {outcome: new, unit: people}
    observation:
      outcome: diagnoses
      manager: ryan-white-web-display-2025-04-08
      source_ids: [cdc-nhss-atlasplus]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.aggregated.county, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.surveillance.reports, ontology: cdc.msa.reports, public_source_ids: [cdc-nhss-atlasplus]}
        state:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
    likelihood: {kind: basic, from_year: 2008}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  ehe-diagnosed-prevalence:
    stage: ehe
    classification: active_likelihood_family
    label: People living with diagnosed HIV
    simulation: {outcome: diagnosed.prevalence, unit: people}
    observation:
      outcome: diagnosed.prevalence
      manager: ryan-white-web-display-2025-04-08
      source_ids: [cdc-nhss-atlasplus]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.aggregated.county, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.surveillance.reports, ontology: cdc.msa.reports, public_source_ids: [cdc-nhss-atlasplus]}
        state:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
    likelihood: {kind: basic, from_year: 2008}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  ehe-awareness:
    stage: ehe
    classification: active_likelihood_family
    label: Awareness of HIV status
    simulation: {outcome: awareness, unit: proportion}
    observation:
      outcome: awareness
      manager: ryan-white-web-display-2025-04-08
      source_ids: [cdc-nhss-atlasplus]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.aggregated.proportion, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
        state:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
    likelihood: {kind: nested_proportion, denominator_outcome: total.prevalence, from_year: 2008}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  ehe-suppression:
    stage: ehe
    classification: active_likelihood_family
    label: Viral suppression among people with diagnosed HIV
    simulation: {outcome: suppression, unit: proportion}
    observation:
      outcome: suppression
      manager: ryan-white-web-display-2025-04-08
      source_ids: [cdc-nhss-atlasplus]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: cdc.aggregated.proportion, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: lhd, ontology: lhd, public_source_ids: [local-health-department-suppression]}
        state:
          - {source: cdc.hiv, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
    likelihood: {kind: nested_proportion, denominator_outcome: diagnosed.prevalence, from_year: 2008}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  ehe-testing:
    stage: ehe
    classification: active_likelihood_family
    label: Proportion tested for HIV
    simulation: {outcome: testing, unit: proportion}
    observation:
      outcome: proportion.tested
      manager: ryan-white-web-display-2025-04-08
      source_ids: [cdc-brfss]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: brfss, ontology: brfss, public_source_ids: [cdc-brfss]}
        state:
          - {source: brfss, ontology: brfss, public_source_ids: [cdc-brfss]}
    likelihood: {kind: nested_proportion, denominator_outcome: adult.population, from_year: 2010}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  ehe-prep-uptake:
    stage: ehe
    classification: active_likelihood_family
    label: PrEP use
    simulation: {outcome: prep.uptake, unit: people}
    observation:
      outcome: prep
      manager: ryan-white-web-display-2025-04-08
      source_ids: [aidsvu-prep]
      binding: explicit
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - {source: prep.cdc.aggregated.county, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
          - {source: prep.aidsvu.aggregated.county, ontology: aidsvu, public_source_ids: [aidsvu-prep]}
        state:
          - {source: aidsvu, ontology: aidsvu, public_source_ids: [aidsvu-prep]}
          - {source: cdc.prep, ontology: cdc, public_source_ids: [cdc-nhss-atlasplus]}
    likelihood: {kind: basic, from_year: 2007}
    facets: [total, age, race, sex]
    public_panel: model_fit_check
  rw-non-adap-clients:
    stage: ryan-white
    classification: active_likelihood_target
    label: People receiving non-ADAP Ryan White services
    simulation: {outcome: non.adap.clients, unit: people}
    observation:
      outcome: non.adap.clients
      manager: ryan-white-web-display-2025-04-08
      source_ids: [hrsa-rwhap-annual]
      binding: explicit
      provenance_confidence: verified
      manager_bindings:
        msa:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
        state:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
    likelihood: {kind: basic, from_year: 2017, dimensions: [age, sex, race], levels_of_stratification: [0, 1]}
    facets: [total, age, race, sex]
    public_panel: calibration_target
  rw-non-adap-sex-risk-distribution:
    stage: ryan-white
    classification: active_likelihood_target
    label: Sex and transmission-risk distribution among non-ADAP clients
    simulation: {outcome: non.adap.clients, unit: within_year_proportion}
    observation:
      outcome: non.adap.clients
      manager: ryan-white-web-display-2025-04-08
      source_ids: [hrsa-rwhap-annual]
      binding: explicit_custom_transformation
      provenance_confidence: verified
      manager_bindings:
        msa:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
        state:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
    likelihood: {kind: custom, from_year: 2017, dimensions: [sex, risk]}
    facets: [sex_risk]
    public_panel: not_exported
  rw-oahs-clients:
    stage: ryan-white
    classification: active_likelihood_target
    label: People receiving outpatient ambulatory health services
    simulation: {outcome: oahs.clients, unit: people}
    observation:
      outcome: oahs.clients
      manager: ryan-white-web-display-2025-04-08
      source_ids: [hrsa-rwhap-annual]
      binding: explicit
      provenance_confidence: verified
      manager_bindings:
        msa:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
        state:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
    likelihood: {kind: basic, from_year: 2017, dimensions: [age, sex, race, risk], levels_of_stratification: [0, 1]}
    facets: [total, age, race, sex]
    public_panel: calibration_target
  rw-oahs-suppression:
    stage: ryan-white
    classification: active_likelihood_target
    label: Viral suppression among OAHS clients
    simulation: {outcome: oahs.suppression, unit: proportion}
    observation:
      outcome: oahs.suppression
      manager: ryan-white-web-display-2025-04-08
      source_ids: [hrsa-rwhap-annual]
      binding: explicit
      provenance_confidence: verified
      manager_bindings:
        msa:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
        state:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
    likelihood: {kind: basic, from_year: 2017, dimensions: [age, sex, race, risk], levels_of_stratification: [0, 1, 2]}
    facets: [total, age, race, sex]
    public_panel: calibration_target
  rw-msa-adap-ratio:
    stage: ryan-white
    classification: active_likelihood_target
    label: ADAP-to-non-ADAP client ratio
    simulation: {outcome: adap.proportion, unit: ratio}
    observation:
      outcome: adap.proportion
      manager: ryan-white-web-display-2025-04-08
      source_ids: [hrsa-rwhap-annual, cdc-nhss-atlasplus]
      binding: explicit_nested_geography
      location_binding: nested_likelihood_locations
      provenance_confidence: verified
      manager_bindings:
        msa:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual, cdc-nhss-atlasplus]}
    likelihood:
      kind: nested_proportion
      denominator_outcome: non.adap.clients
      location_types: [STATE, CBSA]
      maximum_locations_per_type: 2
      minimum_geographic_resolution_type: COUNTY
      from_year: 2017
      to_year: 2021
      dimensions: [age, sex, race, risk]
      levels_of_stratification: [0, 1]
    facets: [total, age, race, sex]
    public_panel: related_model_fit_check
  rw-msa-adap-suppressed-share-diagnosed:
    stage: ryan-white
    classification: active_likelihood_target
    label: ADAP-suppressed clients as a share of diagnosed prevalence
    simulation:
      outcome: adap.suppressed.proportion.of.diagnosed
      unit: proportion
      expression: adap.clients * adap.suppression / diagnosed.prevalence
      ontology_outcome: diagnosed.prevalence
      derivation:
        operation: multiply_divide
        numerator_outcomes: [adap.clients, adap.suppression]
        denominator_outcomes: [diagnosed.prevalence]
    observation:
      outcome: adap.suppressed.proportion.of.diagnosed
      manager: ryan-white-full-2026-03-16
      source_ids: [hrsa-rwhap-annual, nastad-adap-monitoring, cdc-nhss-atlasplus]
      binding: explicit_derived_candidate
      location_binding: nested_likelihood_locations
      provenance_confidence: reconstructed
      manager_bindings:
        msa:
          - source: ryan.white.program
            ontology: ryan.white.pdfs
            public_source_ids: [hrsa-rwhap-annual, nastad-adap-monitoring, cdc-nhss-atlasplus]
    likelihood:
      kind: nested_proportion
      denominator_outcome: diagnosed.prevalence
      location_types: [STATE, CBSA]
      maximum_locations_per_type: 2
      minimum_geographic_resolution_type: COUNTY
      from_year: 2017
      dimensions: [age, sex, race, risk]
      levels_of_stratification: [0, 1]
    facets: [total, age, race, sex]
    public_panel: related_model_fit_check
  rw-state-adap-clients:
    stage: ryan-white
    classification: active_likelihood_target
    label: ADAP clients
    simulation: {outcome: adap.clients, unit: people}
    observation:
      outcome: adap.clients
      manager: ryan-white-full-2026-03-16
      source_ids: [hrsa-rwhap-annual]
      binding: explicit_candidate_override
      provenance_confidence: reconstructed
      reject_simset_mapping: non.adap.clients
      manager_bindings:
        state:
          - {source: ryan.white.program, ontology: ryan.white.pdfs, public_source_ids: [hrsa-rwhap-annual]}
    likelihood: {kind: basic, from_year: 2017, dimensions: [age, sex, race], levels_of_stratification: [0, 1]}
    facets: [total, age, race, sex]
    public_panel: calibration_target_with_reconstructed_observations
  rw-state-adap-suppression:
    stage: ryan-white
    classification: active_likelihood_target
    label: Viral suppression among ADAP clients
    simulation: {outcome: adap.suppression, unit: proportion}
    observation:
      outcome: adap.suppression
      manager: ryan-white-web-display-2025-04-08
      source_ids: [nastad-adap-monitoring]
      binding: explicit
      provenance_confidence: verified
      manager_bindings:
        state:
          - {source: nastad.adap, ontology: ryan.white.pdfs, public_source_ids: [nastad-adap-monitoring]}
    likelihood: {kind: basic, from_year: 2017, dimensions: [age, sex, race, risk], levels_of_stratification: [0, 1, 2]}
    facets: [total, age, race, sex]
    public_panel: calibration_target
