name: shield-spike

# Validation only. SHIELD is not a deployed backend model, is not listed in
# models.yml, and must not enter the normal model promotion path from here.
on:
  pull_request:
    branches: [main]
    paths:
      - workloads/shield/**
      - .github/workflows/shield-spike.yml
  workflow_dispatch:
    inputs:
      export_image:
        description: 'Save the tested image as a workflow artifact (for a server pilot)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shield-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - name: validate spike contract
        run: pytest workloads/shield/tests/test_contract.py -q

  build-recorded:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build recorded SHIELD candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: workloads/shield
          file: workloads/shield/Dockerfile
          target: recorded
          platforms: linux/amd64
          load: true
          push: false
          tags: jheem-shield:ci
          build-contexts: |
            jheem_analyses=https://github.com/tfojo1/jheem_analyses.git#e0580817212079fec1cb249f424bf5df9cfbeb3f
            jheem2=https://github.com/CIPHER-Epi/jheem2.git#ccb1f9bfe40844143dbcec65ffd27829aa39d7ef
            locations=https://github.com/tfojo1/locations.git#2481fc440cf1d981bb1005dd903708a88a528d13
          cache-from: type=gha,scope=shield-spike-v2
          cache-to: type=gha,mode=max,scope=shield-spike-v2
      - name: prepare pinned test inputs
        run: python3 workloads/shield/tests/prepare_inputs.py "$RUNNER_TEMP/shield-cache"
      - name: preflight the recorded image offline
        env:
          CENSUS_TAG: data-managers-v2026.08.26
          SYPHILIS_TAG: syphilis-manager-v2026.07.27
        run: |
          mkdir -p "$RUNNER_TEMP/shield-state"
          run_shield() {
            docker run --rm --network none \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$RUNNER_TEMP/shield-cache,dst=/work/cache,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/shield-state,dst=/work/state" \
              --env "JHEEM_CENSUS_MANAGER_TAG=$CENSUS_TAG" \
              --env "JHEEM_SYPHILIS_MANAGER_TAG=$SYPHILIS_TAG" \
              --env SHIELD_RANDOM_SEED=20260916 \
              jheem-shield:ci "$@"
          }
          run_shield preflight
      - name: interrupt a real tiny calibration and resume to its next checkpoint
        env:
          CENSUS_TAG: data-managers-v2026.08.26
          SYPHILIS_TAG: syphilis-manager-v2026.07.27
          SHIELD_IMAGE: jheem-shield:ci
          SHIELD_CACHE: ${{ runner.temp }}/shield-cache
          SHIELD_STATE: ${{ runner.temp }}/shield-state
        run: bash workloads/shield/tests/test_checkpoint_resume.sh
      - name: upload canary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-canary-diagnostics
          path: ${{ runner.temp }}/shield-state/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      # A server pilot loads exactly the image this run tested; nothing is pushed
      # to a registry. Opt-in (manual input, or the PR label export-image),
      # because the archive is several GB.
      - name: export the tested image
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_image) || contains(github.event.pull_request.labels.*.name, 'export-image'))
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shield-image"
          docker save jheem-shield:ci | gzip -1 >"$RUNNER_TEMP/shield-image/jheem-shield-recorded.tar.gz"
          {
            echo "image_id=$(docker image inspect --format '{{.Id}}' jheem-shield:ci)"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "containers_commit=$GITHUB_SHA"
            (cd "$RUNNER_TEMP/shield-image" && sha256sum jheem-shield-recorded.tar.gz)
          } >"$RUNNER_TEMP/shield-image/IMAGE.txt"
          cat "$RUNNER_TEMP/shield-image/IMAGE.txt"
      - name: upload the tested image
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_image) || contains(github.event.pull_request.labels.*.name, 'export-image'))
        uses: actions/upload-artifact@v4
        with:
          name: shield-recorded-image
          path: ${{ runner.temp }}/shield-image/
          retention-days: 7
          compression-level: 0
