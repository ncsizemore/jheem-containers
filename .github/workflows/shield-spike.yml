name: shield-spike

# Validation only. SHIELD is not a deployed backend model, is not listed in
# models.yml, and must not enter the normal model promotion path from here.
on:
  push:
    branches: [main]
    paths:
      - workloads/shield/**
      - .github/workflows/shield-spike.yml
  pull_request:
    branches: [main]
    paths:
      - workloads/shield/**
      - .github/workflows/shield-spike.yml
  workflow_dispatch:
    inputs:
      export_image:
        description: 'Save the tested image as a workflow artifact (for a server pilot)'
        required: false
        default: false
        type: boolean
      jheem_analyses_ref:
        description: 'jheem_analyses commit to build (full SHA; must include the recorded runtime). Empty uses the Dockerfile default.'
        required: false
        default: ''
        type: string
      input_profile:
        description: 'Immutable test inputs: retained July, historical May, or intended September manager. Does not change installed defaults.'
        required: false
        default: retained
        type: choice
        options:
          - retained
          - native-2026-10-01
          - september-2026
      compare_fixed_parameters:
        description: 'Compare installed and hand-sourced engines in the same image using September inputs (no MCMC in this check)'
        required: false
        default: false
        type: boolean
      compare_calibration_traces:
        description: 'Compare two fresh runs, a twice-resumed run, and a changed seed (eight iterations each)'
        required: false
        default: false
        type: boolean
      check_stage1_handoff:
        description: 'Run two-iteration copies of the actual stage-0 and stage-1 registrations, checking predecessor transfer (use September inputs)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shield-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - name: validate spike contract
        run: |
          bash -n workloads/shield/shield-run.sh
          pytest workloads/shield/tests -q

  build-recorded:
    # Main-branch handoff/script edits get fast checks without rebuilding or
    # publishing an image. PRs and manual dispatch retain the full canary.
    if: github.event_name != 'push'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # A manual run can build another SHIELD commit, such as the one a team
      # calibration is about to use; otherwise the reviewed Dockerfile default.
      JHEEM_ANALYSES_REF: ${{ inputs.jheem_analyses_ref || 'd23deca51b33f18bcbf3c726bf7b9264141caab0' }}
      SHIELD_INPUT_PROFILE: ${{ inputs.input_profile || 'retained' }}
    steps:
      - uses: actions/checkout@v7
      - name: check the SHIELD source commit
        run: |
          [[ "$JHEEM_ANALYSES_REF" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "jheem_analyses_ref must be a full 40-character commit SHA" >&2; exit 1; }
          echo "Building jheem_analyses $JHEEM_ANALYSES_REF"
      - uses: docker/setup-buildx-action@v4
      - name: build recorded SHIELD candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: workloads/shield
          file: workloads/shield/Dockerfile
          target: recorded
          platforms: linux/amd64
          load: true
          push: false
          tags: jheem-shield:ci
          build-args: |
            JHEEM_ANALYSES_REF=${{ env.JHEEM_ANALYSES_REF }}
          build-contexts: |
            jheem_analyses=https://github.com/tfojo1/jheem_analyses.git#${{ env.JHEEM_ANALYSES_REF }}
            jheem2=https://github.com/CIPHER-Epi/jheem2.git#9578726b012a2ee380b380ef0203733d1bd81163
            locations=https://github.com/tfojo1/locations.git#2481fc440cf1d981bb1005dd903708a88a528d13
            bayesian_simulations=https://github.com/tfojo1/bayesian.simulations.git#4e0d13e85857396bb0e6e2ac1d244775b2145f75
            distributions=https://github.com/tfojo1/distributions.git#4d71d9644b4439a59210e804520ac8717ae8f079
          cache-from: type=gha,scope=shield-spike-v3
          cache-to: type=gha,mode=max,scope=shield-spike-v3
      - name: Check recorded runtime and cache boundaries without model data
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" jheem-shield:ci shell -c '
            # Discover the pinned library in /app, then retain it when each
            # standalone test starts from the source tree.
            R_LIBS="$(Rscript -e '\''writeLines(paste(.libPaths(), collapse = ":"))'\'' | tail -n 1)"
            export R_LIBS
            cd "$JHEEM_ANALYSES_PATH"
            Rscript applications/SHIELD/tests/test-recorded-runtime.R &&
            Rscript applications/SHIELD/tests/test-recorded-cache.R &&
            Rscript applications/SHIELD/tests/test-output-checks.R &&
            Rscript applications/SHIELD/tests/test-stage1-compatibility.R &&
            Rscript applications/SHIELD/tests/test-trace-checks.R &&
            Rscript applications/SHIELD/tests/test-container-smoke-register.R &&
            Rscript applications/SHIELD/tests/test-stage1-handoff.R &&
            Rscript applications/SHIELD/tests/test-manager-selection.R &&
            Rscript commoncode/tests/test_data_manager_release_selection.R
          '
      - name: prepare pinned test inputs
        run: python3 workloads/shield/tests/prepare_inputs.py "$RUNNER_TEMP/shield-cache" --profile "$SHIELD_INPUT_PROFILE" --github-env "$GITHUB_ENV"
      - name: checkout the exact analysis source for comparison
        if: inputs.compare_fixed_parameters
        uses: actions/checkout@v7
        with:
          repository: tfojo1/jheem_analyses
          ref: ${{ env.JHEEM_ANALYSES_REF }}
          path: comparison-sources/jheem_analyses
          persist-credentials: false
          sparse-checkout: |
            applications/SHIELD
            commoncode
      - name: checkout the exact engine source for comparison
        if: inputs.compare_fixed_parameters
        uses: actions/checkout@v7
        with:
          repository: CIPHER-Epi/jheem2
          ref: 9578726b012a2ee380b380ef0203733d1bd81163
          path: comparison-sources/jheem2
          persist-credentials: false
      - name: compare fixed parameters through both engine loaders
        if: inputs.compare_fixed_parameters
        run: |
          python3 workloads/shield/tests/prepare_inputs.py "$RUNNER_TEMP/shield-cache" --profile september-2026
          bash workloads/shield/tests/run_fixed_comparison.sh jheem-shield:ci \
            "$GITHUB_WORKSPACE/comparison-sources/jheem_analyses" \
            "$GITHUB_WORKSPACE/comparison-sources/jheem2" \
            "$RUNNER_TEMP/shield-cache" "$RUNNER_TEMP/shield-fixed-comparison"
      - name: upload fixed-parameter comparison evidence
        if: always() && inputs.compare_fixed_parameters
        uses: actions/upload-artifact@v4
        with:
          name: shield-fixed-comparison
          path: |
            ${{ runner.temp }}/shield-fixed-comparison/*-report/
            ${{ runner.temp }}/shield-fixed-comparison/*.log
            ${{ runner.temp }}/shield-fixed-comparison/*.json
            ${{ runner.temp }}/shield-fixed-comparison/*.txt
            ${{ runner.temp }}/shield-fixed-comparison/parameters.rds
          if-no-files-found: warn
          retention-days: 14
      - name: preflight the recorded image offline
        run: |
          mkdir -p "$RUNNER_TEMP/shield-state"
          run_shield() {
            docker run --rm --network none \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$RUNNER_TEMP/shield-cache,dst=/work/cache,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP/shield-state,dst=/work/state" \
              --env "JHEEM_CENSUS_MANAGER_TAG=$CENSUS_TAG" \
              --env "JHEEM_SYPHILIS_MANAGER_TAG=$SYPHILIS_TAG" \
              --env "SHIELD_RANDOM_SEED=$SHIELD_RANDOM_SEED" \
              jheem-shield:ci "$@"
          }
          run_shield preflight
      - name: interrupt a real tiny calibration and resume to its next checkpoint
        env:
          SHIELD_IMAGE: jheem-shield:ci
          SHIELD_CACHE: ${{ runner.temp }}/shield-cache
          SHIELD_STATE: ${{ runner.temp }}/shield-state
        run: bash workloads/shield/tests/test_checkpoint_resume.sh
      - name: complete the calibration, check run records, and run a two-stage pipeline
        env:
          SHIELD_IMAGE: jheem-shield:ci
          SHIELD_CACHE: ${{ runner.temp }}/shield-cache
          SHIELD_STATE: ${{ runner.temp }}/shield-state
        run: bash workloads/shield/tests/test_records_and_pipeline.sh
      - name: upload canary diagnostics and run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-canary-diagnostics
          path: |
            ${{ runner.temp }}/shield-state/diagnostics/
            ${{ runner.temp }}/shield-state/run_records/
          if-no-files-found: ignore
          retention-days: 14
      - name: exercise actual stage-1 likelihood and predecessor handoff
        if: inputs.check_stage1_handoff
        env:
          SHIELD_IMAGE: jheem-shield:ci
          SHIELD_CACHE: ${{ runner.temp }}/shield-cache
          SHIELD_HANDOFF_STATE: ${{ runner.temp }}/shield-stage1-handoff
        run: bash workloads/shield/tests/test_stage1_handoff.sh
      - name: upload actual stage-1 handoff evidence
        if: always() && inputs.check_stage1_handoff
        uses: actions/upload-artifact@v4
        with:
          name: shield-stage1-handoff
          path: |
            ${{ runner.temp }}/shield-stage1-handoff/diagnostics/
            ${{ runner.temp }}/shield-stage1-handoff/run_records/
          if-no-files-found: warn
          retention-days: 14
      - name: compare seeded fresh and resumed calibration traces
        if: inputs.compare_calibration_traces
        env:
          SHIELD_IMAGE: jheem-shield:ci
          SHIELD_CACHE: ${{ runner.temp }}/shield-cache
          SHIELD_REPLAY_OUTPUT: ${{ runner.temp }}/shield-repeatability
        run: bash workloads/shield/tests/test_repeatability.sh
      - name: upload calibration trace comparison evidence
        if: always() && inputs.compare_calibration_traces
        uses: actions/upload-artifact@v4
        with:
          name: shield-repeatability
          path: |
            ${{ runner.temp }}/shield-repeatability/*.json
            ${{ runner.temp }}/shield-repeatability/*.log
            ${{ runner.temp }}/shield-repeatability/*/run_records/
          if-no-files-found: warn
          retention-days: 14
      # A server pilot loads exactly the image this run tested; nothing is pushed
      # to a registry. Opt-in (manual input, or the PR label export-image),
      # because the archive is several GB.
      - name: export the tested image
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_image) || contains(github.event.pull_request.labels.*.name, 'export-image'))
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shield-image"
          docker save jheem-shield:ci | gzip -1 >"$RUNNER_TEMP/shield-image/jheem-shield-recorded.tar.gz"
          {
            echo "image_id=$(docker image inspect --format '{{.Id}}' jheem-shield:ci)"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "containers_commit=$GITHUB_SHA"
            echo "jheem_analyses_ref=$JHEEM_ANALYSES_REF"
            echo "jheem2_ref=9578726b012a2ee380b380ef0203733d1bd81163"
            echo "input_profile=$SHIELD_INPUT_PROFILE"
            echo "census_tag=$CENSUS_TAG"
            echo "syphilis_tag=$SYPHILIS_TAG"
            echo "random_seed=$SHIELD_RANDOM_SEED"
            (cd "$RUNNER_TEMP/shield-image" && sha256sum jheem-shield-recorded.tar.gz)
          } >"$RUNNER_TEMP/shield-image/IMAGE.txt"
          cat "$RUNNER_TEMP/shield-image/IMAGE.txt"
      - name: upload the tested image
        if: success() && ((github.event_name == 'workflow_dispatch' && inputs.export_image) || contains(github.event.pull_request.labels.*.name, 'export-image'))
        uses: actions/upload-artifact@v4
        with:
          name: shield-recorded-image
          path: ${{ runner.temp }}/shield-image/
          retention-days: 7
          compression-level: 0
