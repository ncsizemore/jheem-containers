name: build

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build: all | base | ryan-white-msa | ryan-white-ajph | ryan-white-croi | cdc-testing'
        default: all

jobs:
  # Decide which images to build: dispatch (explicit), tag push (the tagged
  # image), or branch push (path-filtered; a base/ change rebuilds all).
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          IMAGE: ${{ github.event.inputs.image }}
          BEFORE: ${{ github.event.before }}
        run: |
          ALL='[
            {"name":"base","image":"jheem-base","context":"base"},
            {"name":"ryan-white-msa","image":"jheem-ryan-white-msa","context":"models/ryan-white-msa"},
            {"name":"ryan-white-ajph","image":"jheem-ryan-white-ajph","context":"models/ryan-white-ajph"},
            {"name":"ryan-white-croi","image":"jheem-ryan-white-croi","context":"models/ryan-white-croi"},
            {"name":"cdc-testing","image":"jheem-cdc-testing","context":"models/cdc-testing"}
          ]'
          pick=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "${IMAGE:-all}" = "all" ]; then pick="ALL"; else pick="$IMAGE"; fi ;;
            *)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="${GITHUB_REF#refs/tags/}"; pick="${tag%-v*}"
              else
                if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
                else
                  files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)
                fi
                if echo "$files" | grep -q '^base/'; then
                  pick="ALL"
                else
                  for n in ryan-white-msa ryan-white-ajph ryan-white-croi cdc-testing; do
                    echo "$files" | grep -q "^models/$n/" && pick="$pick $n"
                  done
                fi
              fi ;;
          esac
          if [ "$pick" = "ALL" ]; then
            matrix="$ALL"
          elif [ -z "$(echo $pick | tr -d ' ')" ]; then
            matrix="[]"
          else
            names=$(printf '%s\n' $pick | jq -R . | jq -cs .)
            matrix=$(echo "$ALL" | jq -c --argjson names "$names" '[.[] | select(.name as $n | $names | index($n))]')
          fi
          matrix=$(echo "$matrix" | jq -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$matrix" | jq 'length')" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "Selected: $matrix"

  build:
    needs: select
    if: ${{ needs.select.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Preserve the existing published image names so models.json/production is untouched.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=match,pattern=${{ matrix.name }}-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=${{ matrix.name }}-v(\d+\.\d+)\.\d+,group=1
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
