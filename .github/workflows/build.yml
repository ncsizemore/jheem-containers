name: build

# Build -> test-by-digest -> promote gate.
#   build:   build the candidate, push it, capture its immutable DIGEST
#   test:    pull that exact digest, run smoke + golden/perturbation tests
#   promote: re-tag the *tested digest* to :latest / semver (NO rebuild between
#            test and promotion). Promotion happens only on push to main / a
#            release tag and only if the tests passed; PRs and dispatch validate
#            without promoting.

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: 'all | base | ryan-white-msa | ryan-white-ajph | ryan-white-croi | cdc-testing'
        default: all

permissions:
  contents: read
  packages: write

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          IMAGE: ${{ github.event.inputs.image }}
          BEFORE: ${{ github.event.before }}
        run: |
          ALL='[
            {"name":"base","image":"jheem-base","context":"base"},
            {"name":"ryan-white-msa","image":"jheem-ryan-white-msa","context":"models/ryan-white-msa"},
            {"name":"ryan-white-ajph","image":"jheem-ryan-white-ajph","context":"models/ryan-white-ajph"},
            {"name":"ryan-white-croi","image":"jheem-ryan-white-croi","context":"models/ryan-white-croi"},
            {"name":"cdc-testing","image":"jheem-cdc-testing","context":"models/cdc-testing"}
          ]'
          pick=""
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              if [ "${IMAGE:-all}" = "all" ]; then pick="ALL"; else pick="$IMAGE"; fi ;;
            *)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                tag="${GITHUB_REF#refs/tags/}"; pick="${tag%-v*}"
              else
                if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                  files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
                else
                  files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" 2>/dev/null || true)
                fi
                if echo "$files" | grep -qE '^(base/|tests/|\.github/)'; then
                  pick="ALL"
                else
                  for n in ryan-white-msa ryan-white-ajph ryan-white-croi cdc-testing; do
                    echo "$files" | grep -q "^models/$n/" && pick="$pick $n"
                  done
                fi
              fi ;;
          esac
          if [ "$pick" = "ALL" ]; then
            matrix="$ALL"
          elif [ -z "$(echo $pick | tr -d ' ')" ]; then
            matrix="[]"
          else
            names=$(printf '%s\n' $pick | jq -R . | jq -cs .)
            matrix=$(echo "$ALL" | jq -c --argjson names "$names" '[.[] | select(.name as $n | $names | index($n))]')
          fi
          matrix=$(echo "$matrix" | jq -c .)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$matrix" | jq 'length')" -gt 0 ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "Selected: $matrix"

  build:
    needs: select
    if: ${{ needs.select.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          push: true   # push a throwaway candidate tag so the digest is pullable downstream
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:gate-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: record candidate digest
        run: |
          mkdir -p dg
          printf 'ghcr.io/%s/%s@%s' "${{ github.repository_owner }}" "${{ matrix.image }}" "${{ steps.build.outputs.digest }}" > dg/ref
          echo "candidate: $(cat dg/ref)"
      - uses: actions/upload-artifact@v4
        with:
          name: ref-${{ matrix.name }}
          path: dg/ref

  test:
    needs: [select, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ref-${{ matrix.name }}
          path: dg
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tests/requirements.txt
      - name: free disk + add swap (1000-sim state/CDC runs exceed the runner's 16GB RAM)
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/dotnet /usr/local/share/boost /opt/microsoft 2>/dev/null || true
          sudo fallocate -l 24G /mnt/swapfile && sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          echo "--- disk ---"; df -h / | tail -1
          echo "--- memory+swap ---"; free -h | head -3
      - name: test candidate digest (smoke + golden/perturbation)
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${{ matrix.name }}" = "base" ]; then echo "base has no model tests"; exit 0; fi
          REF=$(cat dg/ref)
          export "GATE_IMAGE_$(printf '%s' '${{ matrix.name }}' | tr 'a-z-' 'A-Z_')=$REF"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pytest tests -k "${{ matrix.name }}" -m "not slow" -v
          else
            pytest tests -k "${{ matrix.name }}" -v
          fi

  promote:
    needs: [select, build, test]
    # Only on a real release event, and only if every test passed (fail-closed).
    if: >-
      needs.test.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ref-${{ matrix.name }}
          path: dg
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=match,pattern=${{ matrix.name }}-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=${{ matrix.name }}-v(\d+\.\d+)\.\d+,group=1
      - name: promote the tested digest (no rebuild)
        run: |
          REF=$(cat dg/ref)
          TAGS=$(printf '%s' "${{ steps.meta.outputs.tags }}" | sed 's/^/-t /' | tr '\n' ' ')
          echo "Re-tagging $REF -> $TAGS"
          docker buildx imagetools create $TAGS "$REF"
